<section class="pokedex-panel">
  <div class="panel-lights">
    <span class="light blue"></span>
    <span class="light red"></span>
    <span class="light yellow"></span>
    <span class="light green"></span>
  </div>

  <div class="filters">
    <input
      class="filter-name"
      type="search"
      placeholder="BUSCAR NOMBRE O Nº..."
      [value]="search()"
      (input)="search.set($any($event.target).value)"
    />

    <select [value]="generation() ?? ''" (change)="onGenerationChange($any($event.target).value)">
      <option value="">Todas las generaciones</option>
      @for (g of generations(); track g) {
        <option [value]="g">Generación {{ g }}</option>
      }
    </select>

    <select [value]="sortBy()" (change)="onSortChange($any($event.target).value)">
      <option value="id">Ordenar por nº</option>
      <option value="name">Ordenar por nombre</option>
      <option value="total">Ordenar por stats</option>
    </select>

    <label class="toggle">
      <input
        type="checkbox"
        [checked]="onlyLegendary()"
        (change)="onlyLegendary.set($any($event.target).checked)"
      />
      <span class="switch"></span>
      <span>★ Legendarios</span>
    </label>

    @if (hasActiveFilters()) {
      <button type="button" class="reset-btn" (click)="resetFilters()">Limpiar</button>
    }
  </div>

  <div class="type-chips">
    @for (t of allTypes(); track t) {
      <button
        type="button"
        class="chip"
        [attr.data-type]="t"
        [class.active]="selectedTypes().includes(t)"
        (click)="toggleType(t)"
      >
        {{ t }}
      </button>
    }
  </div>
</section>
